name: docs-check

"on":
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**.md"
      - "tools/validators/validate_links.py"
  pull_request:
    paths:
      - "**.md"
      - "tools/validators/validate_links.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Markdown links and records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Link validator
        run: python tools/validators/run_all.py --repo .
